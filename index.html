<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecobike Helsinki | Rental & Service</title>
    <style>
        :root { --primary-green: #2d5a27; --light-gray: #f4f4f4; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; margin: 0; padding: 0; color: #333; }
        
        /* Header & Hero */
        .hero { background: var(--primary-green); color: white; padding: 40px 20px; text-align: center; }
        .btn { display: inline-block; padding: 12px 24px; border-radius: 25px; text-decoration: none; font-weight: bold; margin: 5px; transition: 0.3s; }
        .btn-white { background: white; color: var(--primary-green); }
        
        /* Services Section (Moved Up) */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 40px 20px; max-width: 800px; margin: auto; }
        .service-card { background: var(--light-gray); padding: 20px; border-radius: 12px; text-align: center; font-weight: bold; }

        /* Booking Form Section */
        .booking-section { background: white; padding: 40px 20px; max-width: 600px; margin: auto; border: 1px solid #ddd; border-radius: 15px; margin-bottom: 40px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { background: var(--primary-green); color: white; border: none; cursor: pointer; font-size: 1.1rem; }

        /* Footer/Contact */
        .contact-info { background: var(--light-gray); padding: 40px 20px; text-align: center; }
        .hours { font-weight: bold; color: var(--primary-green); margin-bottom: 20px; }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Ecobike Helsinki</h1>
        <p>Bike rental, repairs, and used bikes in Helsinki.</p>
        <div class="hours">Open: Mon & Tue 14:15–18:00</div>
        <a href="tel:+358400844358" class="btn btn-white">Call Us</a>
    </header>

    <section class="services-grid">
        <div class="service-card">🚲 Rental Bicycles</div>
        <div class="service-card">🔧 Service & Repairs</div>
        <div class="service-card">⚙️ Spare Parts</div>
        <div class="service-card">🏷️ Used Bikes (from 90€)</div>
    </section>

    <section class="booking-section">
        <h2>Book a Rental</h2>
        <form action="mailto:ecobike.helsinki@gmail.com" method="post" enctype="text/plain">
            <label>Dates & Pickup Window</label>
            <input type="text" name="Dates" placeholder="e.g., June 12-14, 10:00 AM" required>
            
            <label>Number of Bikes & Heights</label>
            <input type="text" name="Bikes" placeholder="e.g., 2 bikes (175cm, 160cm)" required>

            <label>Type of Use</label>
            <select name="Type">
                <option value="city">City Riding</option>
                <option value="trekking">Trekking</option>
            </select>

            <label>Brake Preference</label>
            <select name="Brakes">
                <option value="hand">Hand Brakes</option>
                <option value="pedal">Pedal Brakes</option>
            </select>

            <input type="submit" value="Send Booking Request" class="btn submit-btn">
        </form>
    </section>

    <footer class="contact-info">
        <h3>Find Us</h3>
        <p>Savilankatu 1b, 00250 Helsinki</p>
        <a href="https://google.com" target="_blank">View on Google Maps</a>
        <p>Email: ecobike.helsinki@gmail.com</p>
    </footer>

</body>
</html>
